name: Обновить данные OSM

# Пересобирает data/ из OpenStreetMap:
#  - когда меняется regions.json (добавили/убрали провинцию) или скрипт сборки;
#  - раз в неделю (понедельник, 03:00 UTC), чтобы подтянуть правки в OSM;
#  - вручную: Actions → «Обновить данные OSM» → Run workflow.
on:
  push:
    branches: [main]
    paths: ['regions.json', 'scripts/build-data.mjs']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка данных
        run: node scripts/build-data.mjs
      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Обновление данных OSM"
            # Пока шла сборка, в main могли появиться другие коммиты — встраиваемся поверх них.
            git pull --rebase origin main
            git push
          fi
